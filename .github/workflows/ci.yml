name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify native runner architecture
        run: test "$(go env GOHOSTARCH)" = "${{ matrix.arch }}"
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests with race detection
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
      - name: Release tooling tests and source privacy check
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/privacy-audit.py --worktree-only
      - name: Build native Linux review archive
        run: python3 scripts/build-release.py --version 0.0.0-ci --target linux/${{ matrix.arch }} --output dist/review
      - name: Verify archives and native MCP startup
        run: python3 scripts/smoke-release.py dist/review --version 0.0.0-ci
  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/pi/package-lock.json
      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --prefix clients/pi --ignore-scripts --no-audit --no-fund
      - name: Synthetic HTTPS adapter tests
        run: npm test --prefix clients/pi
      - name: Build pi source review bundle
        run: python3 scripts/build-pi-review.py --output dist/pi-review
      - name: Verify pi bundle and clean runtime installation
        run: python3 scripts/smoke-pi-review.py dist/pi-review
