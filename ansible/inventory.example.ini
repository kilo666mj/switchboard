[switchboard]
switchboard.example.com ansible_host=192.0.2.10 ansible_user=root

[parallaxd_tunnel]
parallaxd.example.net ansible_host=198.51.100.20 ansible_port=2222 ansible_user=deploy

[switchboard_monitoring]
prometheus.example.com ansible_host=192.0.2.30 ansible_user=root

# Bootstrap runs as the workstation user, not root. Each host must have its own
# identity and token entry in private.yml. Python 3.11+ and Codex are prerequisites.
[switchboard_clients]
# workstation ansible_host=192.0.2.20 ansible_user=developer switchboard_client_home=/home/developer switchboard_client_identity=workstation

[switchboard_clients:vars]
switchboard_session_url=https://switchboard.example.com/mcp/sessions
# switchboard_ca_file=/secure/path/to/private-root-ca.crt
